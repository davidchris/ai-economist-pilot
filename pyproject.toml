[project]
name = "ai-economist-pilot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.1+cu126", "numpy==1.26.4", "scipy==1.13.1",
  "PyYAML==6.0.2", "lz4==4.4.4", "pycryptodome==3.23.0",
  "GPUtil==1.4.0", "psutil==7.1.0",
]

[dependency-groups]
dev = ["ruff", "ty", "pytest", "pre-commit"]

[tool.pytest.ini_options]
testpaths = ["pilot"]
pythonpath = ["pilot"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.src]
include = ["pilot"]

[tool.ty.environment]
extra-paths = ["pilot", "upstream"]
